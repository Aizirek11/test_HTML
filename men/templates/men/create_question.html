{% extends "men/base.html" %}

{% block content %}
<div style="max-width: 700px; margin: 40px auto; padding: 20px; background: #f8f9fa; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h1 style="text-align:center; margin-bottom: 20px; color:#333;">Добавить вопрос</h1>

    <form method="post">
        {% csrf_token %}

        <!-- Категория -->
        <div style="margin-bottom: 15px;">
            <label style="font-weight:bold;">Категория:</label><br>
            <select name="category" required style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
                <option value="" disabled selected>Выберите категорию</option>
                {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Текст вопроса -->
        <div style="margin-bottom: 15px;">
            <label style="font-weight:bold;">Текст вопроса:</label><br>
            <input type="text" name="text" required style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
        </div>

        <!-- Ответы -->
        <div style="margin-bottom: 15px;">
            <label style="font-weight:bold;">Ответы:</label><br>
            {% for i in "1234" %}
            <div style="margin-bottom: 8px;">
                <input type="text" name="answer_text_{{ forloop.counter }}" placeholder="Ответ {{ forloop.counter }}" required style="width:70%; padding:6px; border-radius:5px; border:1px solid #ccc;">
                <label style="margin-left:10px;">
                    <input type="radio" name="correct_answer" value="{{ forloop.counter }}" required> Правильный
                </label>
            </div>
            {% endfor %}
        </div>

        <!-- Кнопка -->
        <div style="text-align:center;">
            <button type="submit" style="padding:10px 20px; border:none; border-radius:5px; background:#007bff; color:white; cursor:pointer; font-weight:bold;">
                Добавить вопрос
            </button>
        </div>
    </form>

    <!-- Сообщение об успешном добавлении -->
    {% if message %}
        <p style="margin-top:20px; text-align:center; color:green; font-weight:bold;">{{ message }}</p>
    {% endif %}
</div>
{% endblock %}
